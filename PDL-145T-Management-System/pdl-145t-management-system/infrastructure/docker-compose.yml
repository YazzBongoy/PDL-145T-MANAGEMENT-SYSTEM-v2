# Default Docker Compose configuration (Development)
# Use docker-compose.dev.yml for full development setup with hot reload
# Use docker-compose.prod.yml for production deployment

services:
  # Database Layer - PostgreSQL with PostGIS
  # Base image: postgis/postgis:15-3.3
  # Purpose: Geospatial database for PDL-145T management
  db:
    image: postgis/postgis:15-3.3
    container_name: pdl-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-pdl_management}
    ports:
      - '5432:5432'
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pdl_management}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - pdl-network

  # Backend API Layer - Node.js/Express with TypeScript
  # Multi-stage build: builder -> production
  # Purpose: REST API server with Prisma ORM
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: pdl-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-pdl_management}
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key}
      PORT: 8000
    restart: unless-stopped
    networks:
      - pdl-network

  # Graph Database Layer - Neo4j
  # Purpose: Graph database for complex relationships and analytics
  neo4j:
    image: neo4j:5.15-community
    container_name: pdl-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - '7475:7474'  # HTTP
      - '7688:7687'  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - pdl-network

  # Database Administration - Adminer
  # Purpose: Web-based database administration tool
  adminer:
    image: adminer:4.8.1
    container_name: pdl-adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    restart: unless-stopped
    networks:
      - pdl-network

  # Frontend Layer - React with Vite
  # Multi-stage build: builder -> nginx production
  # Purpose: Static web application served via Nginx
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
    container_name: pdl-frontend
    depends_on:
      - backend
    ports:
      - '3001:80'
    environment:
      VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    networks:
      - pdl-network

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  pdl-network:
    driver: bridge
